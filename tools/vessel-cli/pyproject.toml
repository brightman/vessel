[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vessel-cli"
version = "0.1.2"
description = "Vessel HTTP CLI for coding agents"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
vessel = "vessel_cli.cli:main"

[tool.setuptools]
packages = ["vessel_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
