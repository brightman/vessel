[project]
name = "vessel-api"
version = "0.1.0"
description = "API service for Vessel agent storage"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23,<26",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "oss2>=2.19,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "PyJWT[crypto]>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "scalar-fastapi>=1.9.1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
